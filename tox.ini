[tox]
envlist = qiskit, cirq
skipsdist = true

[testenv]
deps =
    -r requirements-dev.txt
commands =
    pytest {posargs:algorithms tests} -q

[testenv:qiskit]
deps =
    {[testenv]deps}
    -r requirements-qiskit.txt

[testenv:cirq]
deps =
    {[testenv]deps}
    -r requirements-cirq.txt

# Documentation site build, split into two stages (see docs/site-generation.md):
# a per-framework demo-generation env (needs that framework's SDK to actually
# run algorithm code) and one framework-agnostic rendering env (only needs the
# pre-generated demo cache + mkdocs — no quantum SDK at all). Add a
# <framework>-docs env alongside each new framework's test env as it's added.
[testenv:qiskit-docs]
deps = {[testenv:qiskit]deps}
commands = python scripts/generate_demo_outputs.py --framework qiskit {posargs}

[testenv:cirq-docs]
deps = {[testenv:cirq]deps}
commands = python scripts/generate_demo_outputs.py --framework cirq {posargs}

[testenv:docs]
deps =
    -r requirements-dev.txt
    -r requirements-docs.txt
commands =
    python scripts/render_docs.py
    mkdocs build
