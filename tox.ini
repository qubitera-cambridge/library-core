[tox]
envlist = qiskit, cirq

[testenv]
# Installs library-core itself (editable) alongside its deps, so tests and any
# code under src/library_core/ can `import library_core` — this also doubles
# as the first real check that the package actually installs correctly, which
# matters once library-ui and Delphi both depend on it via pip.
deps =
    -r requirements-dev.txt
commands =
    pytest {posargs:tests src} -q

[testenv:qiskit]
deps =
    {[testenv]deps}
    -r requirements-qiskit.txt

[testenv:cirq]
deps =
    {[testenv]deps}
    -r requirements-cirq.txt

# Deliberately NOT in envlist / the default public CI matrix — these depend on
# private qubitera-cambridge repos (requirements-krylov.txt / -dfvqls.txt) that
# the public repo can't authenticate to by default. Run explicitly
# (`tox -e krylov`) if you have Git access. See docs/private-dependencies.md.
[testenv:krylov]
deps =
    {[testenv]deps}
    -r requirements-krylov.txt
commands =
    pytest {posargs:src/library_core/algorithms/linear-algebra/quantum-krylov-solver} -q

[testenv:dfvqls]
deps =
    {[testenv]deps}
    -r requirements-dfvqls.txt
commands =
    pytest {posargs:src/library_core/algorithms/linear-algebra/df-vqls-solver} -q
