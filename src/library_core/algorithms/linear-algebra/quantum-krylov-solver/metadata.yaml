id: quantum-krylov-solver
name: "Quantum Krylov Subspace Linear Solver"
aliases:
  - "Quantum Krylov method"
category: linear-algebra
problem_class: "Solve a linear system Ax = b by building a Krylov subspace with a quantum-estimated basis and solving the small projected system classically"
problem_tags:
  - linear-systems
  - krylov-subspace
  - hamiltonian-simulation
  - quantum-linear-algebra
classical_complexity: "O(n^3) for direct solve, or O(n^2) per Krylov iteration classically"
quantum_complexity: "Polynomial in system size for basis estimation via density matrix exponentiation; dominant cost is the number of Hadamard-test-style overlap estimations"
speedup: heuristic
qubits_required: "Depends on the encoding of A, b; the demo here uses a 2x2 dense system requiring only a few qubits for state preparation plus the Hadamard-test ancilla"
circuit_depth: "Depends on basis/implementation choice; real_time basis depth scales with the number of Krylov dimensions requested"
requires_fault_tolerance: false
hardware_assumptions: "NISQ-viable for small systems/low Krylov dimension; accuracy vs. circuit depth is the central tradeoff, same as other near-term variational/subspace methods"
maturity: research
implementations:
  - language: python
    framework: qiskit
    path: qiskit_impl.py
    status: verified-simulator
source:
  repo: qubitera-cambridge/quantum-krylov-core
  url: https://github.com/qubitera-cambridge/quantum-krylov-core
  commit: "3939f4a1d61f65cfe2f59a98f1c73552d0a2ea1a"
  license: "see quantum-krylov-core's own LICENSE (private repo)"
external_dependencies:
  - package: quantum-krylov
    url: https://github.com/qubitera-cambridge/quantum-krylov-core
    access: private
    note: "Sibling qubitera-cambridge project, not third-party code. Requires Git access to this private repo to install — see requirements-krylov.txt and docs/private-dependencies.md. Not installed in library-core's default public CI."
known_limitations:
  - "This wrapper demonstrates only the real_time basis at a small dimension on a 2x2 system; the underlying package supports many more basis/implementation/reduced_solver combinations (chebyshev, lanczos, polynomial, QSP, DF-VQLS as a reduced solver) not exercised here"
  - "Real_time basis at low dimension has real approximation error (confirmed ~7% relative error on the demo system) - this is reported honestly, not hidden"
  - "Not run against real quantum hardware; AerSimulator / exact statevector only"
  - "The underlying package's own PROJECTED_KRYLOV.md documents an exact measurement-cost formula for its architecture='projected' estimator, M = d(d+1)(L+1) + 2d (d = Krylov dimension, L = Pauli-term count of A's dense decomposition) — confirmed to match the vendored code's expectation_evaluations exactly on every dimension tested, d=2..8 at fixed N=8, L=28 (`~/JupyterNBv2/krylov_complexity_scaling.ipynb`, Section 3). This wrapper's own demo() exercises basis='real_time', not architecture='projected', so this exact formula characterizes a different code path in the same package, not this wrapper's current demo configuration"
  - "L does not stay polylogarithmic in problem size N for generic matrices, which the M formula above would need for a genuine asymptotic advantage: measured L(N)=N exactly for a tridiagonal 1-D Laplacian (N=8..512, fitted slope 1.000) but L(N) ~ N^1.326 for a generic fixed-bandwidth random banded SPD matrix (L=28, 72, 176 at N=8, 16, 32) — both linear-or-worse, because a Pauli string acts across the whole binary-encoded index rather than on position-space neighbors, so position-space sparsity alone does not bound Pauli-decomposition size (`~/JupyterNBv2/krylov_complexity_scaling.ipynb`, Sections 8.3/10.3). Combined with the Krylov dimension a fixed target accuracy actually needs (measured via CG, growing close to linearly in N for the Laplacian family since kappa(N) ~ N^2), total architecture='projected' measurement cost at fixed accuracy grows close to cubically in N (fitted slopes 2.871 at eps=0.1, 2.952 at eps=0.01; Section 8.4), not the polylog(N) growth a genuine speedup needs"
  - "This package's own quantum_krylov.qsp module implements a textbook Quantum Signal Processing block encoding, but builds its block-encoding oracle by densely eigendecomposing A classically (np.linalg.eigh) into an explicit dense (2N)x(2N) UnitaryGate — the module's own docstring states 'Dense diagonalization below constructs only the demo block oracle.' Measured directly, transpiled to basis_gates=[rz,sx,x,cx] (`~/JupyterNBv2/krylov_complexity_scaling.ipynb`, Section 10.2): 2,078 / 25,761 / 256,984 / 967,877 CX gates at N=4/8/16/32, chaining that dense per-query oracle once per QSP polynomial-degree query (83-599 queries in this range) — 384x, 966x and 923x more CX gates respectively than df-vqls-solver's own dense vec(A) shortcut at matched N=8/16/32. A genuine LCU+qubitization block encoding (Childs & Wiebe, arXiv:1202.5822; Low & Chuang, Quantum 3, 163 (2019)) is proven to give a real polynomial bound for exactly this construction (Kirby, Motta & Mezzacapo, Quantum 7, 1018 (2023), arXiv:2208.00567) — but only when L=O(poly(n)) (polylogarithmic in N), a condition neither test-matrix family above satisfies; neither PREPARE nor SELECT appear anywhere in this package's source (confirmed by exhaustive grep, same notebook Section 10.3)"
improvement_opportunities:
  - "Expose more of the underlying package's basis/reduced_solver options as demo() parameters rather than one fixed configuration"
  - "Add a worked example using DF-VQLS as the reduced solver, directly exercising the documented relationship between this algorithm and df-vqls-solver"
  - "Benchmark relative error vs. Krylov dimension on a slightly larger system to show the convergence behavior, similar to trotterized-tfim's step-count convergence test"
  - "Benchmark architecture='projected' directly (not just the demo's real_time basis) to show its exact M=d(d+1)(L+1)+2d formula and measure L(N) for a representative matrix family, making this family's distance from the polylogarithmic-L regime a genuine speedup needs visible to users — methodology worked out in `~/JupyterNBv2/krylov_complexity_scaling.ipynb` Sections 3 and 8"
  - "If a genuine (non-dense-eigendecomposition) block encoding for quantum_krylov.qsp is ever pursued, scope it only for matrix families with L=O(poly(n)) Pauli terms — and budget for the still-unresolved address-computation/data-lookup cost a structurally similar investigation found dominant and close to O(N), not O(polylog N), in the two QROM constructions actually built and measured: docs/block_encoding_feasibility.md in the ClimateNotebook repo, Sections 7d and 8"
algorithm_dependencies:
  - hadamard-test
benchmarks:
  - metric: relative_error
    value: 0.0706
    unit: fraction
    conditions: "2x2 system, real_time basis, dimension=2, quantum implementation"
    hardware: "exact statevector (no simulator noise)"
    date: "2026-10-02"
references:
  - "Motta et al. (2020). Determining eigenstates and thermal states on a quantum computer using quantum imaginary time evolution. Nature Physics."
  - "See quantum-krylov-core's own README/docstrings for the full method taxonomy (DME, measured Krylov, QSP-based reduced solve)."
last_reviewed: "2026-10-02"
