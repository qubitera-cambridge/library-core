id: df-vqls-solver
name: "Decomposition-Free Variational Quantum Linear Solver (DF-VQLS)"
aliases:
  - "DF-VQLS"
category: linear-algebra
problem_class: "Solve a linear system Ax = b variationally, without decomposing A into a linear combination of unitaries"
problem_tags:
  - linear-systems
  - vqls
  - variational
  - quantum-linear-algebra
classical_complexity: "O(n^3) for direct solve"
quantum_complexity: "Heuristic - depends on ansatz depth and optimizer convergence; no proven asymptotic speedup"
speedup: heuristic
qubits_required: "2 * ceil(log2(n)) qubits for an n-dimensional system (vectorized matrix encoding doubles the register)"
circuit_depth: "Depends on the chosen ansatz (hardware-efficient by default) and its layer count"
requires_fault_tolerance: false
hardware_assumptions: "NISQ-viable by design - this is explicitly a near-term variational method"
maturity: research
implementations:
  - language: python
    framework: qiskit
    path: qiskit_impl.py
    status: verified-simulator
source:
  repo: qubitera-cambridge/df-vqls-core
  url: https://github.com/qubitera-cambridge/df-vqls-core
  commit: "3e16e9e7ecd6f114cb9293a90dabee06606ed0f7"
  license: "see df-vqls-core's own LICENSE (private repo)"
external_dependencies:
  - package: df-vqls
    url: https://github.com/qubitera-cambridge/df-vqls-core
    access: private
    note: "Sibling qubitera-cambridge project, not third-party code. Requires Git access to this private repo to install — see requirements-dfvqls.txt and docs/private-dependencies.md. Not installed in library-core's default public CI."
known_limitations:
  - "Recovers the solution direction, not necessarily matching scale/sign - demo() correctly compares via cosine similarity, not value equality"
  - "Variational optimization can fail to converge or converge to a local minimum for harder (less diagonal-dominant, larger) systems than this wrapper's small demo"
  - "Not run against real quantum hardware; the ClassicalBackend (shot-free statevector) path is used by this wrapper's demo for fast, deterministic convergence, not the shot-based QuantumBackend"
  - "Decomposition-free does not mean gate-cheap: df-vqls-core's mechanism encodes A by flattening it into vec(A) and amplitude-loading it via Qiskit's generic StatePreparation onto a 2*ceil(log2 N)-qubit register (`circuit_builder.py`/`state_preparer.py`) — no controlled-A operator, no sparsity credit. Measured directly on this exact vendored commit, transpiled to basis_gates=[rz,sx,x,cx] at optimization_level=1 (`~/JupyterNBv2/krylov_complexity_scaling.ipynb`, Section 10.1): 12/67/266/1,049/4,152/16,503/65,782 CX gates at N=4/8/16/32/64/128/256 — fitted log-log slope 2.040, matching the proven Theta(4^n) lower bound for synthesizing an arbitrary state on 2n qubits (Knill, 1995; Shende, Bullock & Markov, IEEE TCAD 2006) almost exactly, even though the test matrix was genuinely sparse (bandwidth 2). This O(N^2) cost never shows up in a normal df_vqls solve: the exact-statevector cost-function path sets transpile_num = transpile_den = 0.0 and calls Statevector.from_instruction directly, so no transpiler pass ever runs"
  - "A genuine structured/sparse block encoding (vs. this mechanism's dense vec(A) shortcut) was investigated for a real, physically-motivated sparse operator in a sibling repo and found only conditionally cheaper, and only at larger N: a complete, gate-counted position-oracle + value-loading + address-computation circuit cost MORE than this dense shortcut at N=16 (633-823 CX vs. 266 CX measured here), becoming cheaper only at N=64 (1.2x-2.1x) — dominated at both sizes by an address-computation sub-circuit neither cited block-encoding paper actually costs for data with no closed-form arithmetic rule. Full gate-counted analysis and citations: docs/block_encoding_feasibility.md in the ClimateNotebook repo (Sections 7-8)"
improvement_opportunities:
  - "Add a demo variant using the shot-based QuantumBackend to show realistic sampling noise effects on convergence"
  - "Add a worked example of quantum-krylov-solver using this as its reduced solver (`reduced_solver='df_vqls'`), directly exercising their documented relationship"
  - "Expose cost_type ('global' vs 'local') and overlap_method as demo() parameters to show the accuracy/cost tradeoff the package documents"
  - "Add a demo/benchmark variant that actually transpiles the built circuit (not just reports the shot-free statevector cost-function's own evaluation count) to surface the real O(N^2) CX-gate cost measured in `~/JupyterNBv2/krylov_complexity_scaling.ipynb` Section 10.1 as N grows — this wrapper's current demo() never triggers a transpiler pass, so that cost is invisible to anyone relying on this wrapper alone"
algorithm_dependencies:
  - hadamard-test
benchmarks:
  - metric: cosine_similarity
    value: 1.0
    unit: fraction
    conditions: "2x2 diagonal system, joint_conditional cost estimator, 22 function evaluations"
    hardware: "ClassicalBackend (shot-free statevector)"
    date: "2026-10-02"
references:
  - "Patil et al. (2022). Variational quantum linear solver. Quantum."
  - "See df-vqls-core's own README/docstrings for the full cost-function and overlap-estimation method taxonomy."
last_reviewed: "2026-10-02"
