[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "library-core"
version = "0.1.0"
description = "QuAlgLib's quantum algorithm library: implementations, metadata, and a catalogue API for consumers like library-ui and Delphi"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/library_core"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.py"]
# --import-mode=importlib: required once multiple algorithms have same-named
# test/impl files (e.g. every Qiskit algorithm's test file is
# test_qiskit_impl.py) with no __init__.py in each directory — avoids pytest's
# classic "import file mismatch" collision on duplicate basenames.
# --continue-on-collection-errors: without this, one algorithm whose test file
# imports an SDK that isn't installed in the current environment (e.g. a Cirq
# algorithm's test when Cirq isn't installed) aborts the ENTIRE pytest session
# with zero tests run — not just that algorithm. Verified during the testing
# architecture review (2026-10-02). Pair with pytest.importorskip('<sdk>') at
# the top of a framework-specific test file so a missing optional SDK reports
# as skipped rather than as a collection error.
addopts = "--import-mode=importlib --continue-on-collection-errors --strict-markers"
markers = [
    "slow: sampled/simulator-backed tests, slower than exact-statevector checks. Run the fast subset with -m 'not slow'.",
]
